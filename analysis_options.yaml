include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
  - flutter
  - build/**
  - android/**
  - ios/**
  - web/**
  - windows/**
  - macos/**
  - linux/**

linter:
  rules:
    - directives_ordering
